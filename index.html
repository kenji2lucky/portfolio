<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Kenji2Lucky — video editor for gaming content." />
  <meta name="theme-color" content="#050505" />
  <title>Kenji2Lucky — Gaming Video Editor</title>

  <link rel="icon" href="./favicon.ico?v=7" sizes="any" />
  <link rel="shortcut icon" href="./favicon.ico?v=7" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/branding/favicon-32.png?v=7" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/branding/favicon-16.png?v=7" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/branding/apple-touch-icon.png?v=7" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />

  <link rel="preload" as="image" href="./assets/hero/hero-banner.png" />
  <link rel="stylesheet" href="./styles.css?v=10" />
  <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player" defer></script>
  <script type="module" src="./script.js?v=10"></script>
</head>
<body>
  <main id="top" class="site">
    <section class="art-section hero" aria-label="Kenji2Lucky introduction">
      <img class="section-art" src="./assets/hero/hero-banner.png" alt="Kenji2Lucky gaming video editor banner" />
      <a class="hotspot hero-work" href="#featured" aria-label="See my work"></a>
      <a class="hotspot hero-contact" href="#contact" aria-label="Get in touch"></a>
    </section>

    <section id="clients" class="art-section clients-section" aria-label="Clients and collaborations" hidden>
      <img class="section-art" src="./assets/clients/clients-background.png" alt="" aria-hidden="true" />
      <div id="client-slots" class="client-slots"></div>
    </section>

    <section id="featured" class="art-section featured-section" aria-label="Featured works">
      <img class="section-art" src="./assets/featured/featured-shell.png?v=9" alt="" aria-hidden="true" />
      <div id="project-overlays"></div>
      <img class="featured-controls-overlay control-1" src="./assets/featured/featured-shell.png?v=9" alt="" aria-hidden="true" />
      <img class="featured-controls-overlay control-2" src="./assets/featured/featured-shell.png?v=9" alt="" aria-hidden="true" />
      <img class="featured-controls-overlay control-3" src="./assets/featured/featured-shell.png?v=9" alt="" aria-hidden="true" />
    </section>

    <footer id="contact" class="art-section footer-section" aria-label="Contact Kenji2Lucky">
      <img class="section-art" src="./assets/footer/footer-banner.png" alt="Kenji2Lucky contact banner" />
      <a id="discord-link" class="hotspot footer-discord" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open Kenji2Lucky on Discord"></a>
      <a id="x-link" class="hotspot footer-x" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open Kenji2Lucky on X"></a>
    </footer>
  </main>

  <dialog id="video-dialog" class="video-dialog">
    <button id="dialog-close" class="dialog-close" type="button" aria-label="Close video">×</button>
    <div id="dialog-player-wrap" class="dialog-player-wrap"></div>
  </dialog>
</body>
</html>
